<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Province map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #061530; font-family: 'Poppins', system-ui, sans-serif; overflow: hidden; }
  #map { width: 100%; height: 100%; }
  svg { width: 100%; height: 100%; display: block; }
  .prov { stroke: #1B3A55; stroke-width: 1; cursor: pointer; transition: opacity .15s ease; }
  .prov:hover { opacity: .82; }
  .plabel { font-size: 9.5px; font-weight: 600; fill: #fff; pointer-events: none; paint-order: stroke; stroke: rgba(6,20,38,.8); stroke-width: 3px; stroke-linejoin: round; }
  #tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s ease;
         background: #061426; border: 1px solid #1E3A52; border-radius: 8px; padding: 8px 11px;
         box-shadow: 0 10px 24px rgba(0,0,0,.45); color: #f3f7fc; font-size: 11px; min-width: 140px; z-index: 9; }
  #tip .n { font-weight: 700; margin-bottom: 4px; }
  #tip .r { display: flex; gap: 16px; justify-content: space-between; color: #8DA2B5; font-variant-numeric: tabular-nums; }
  #tip .r b { font-weight: 600; }
</style>
</head>
<body>
<div id="map"></div>
<div id="tip"></div>
<script>
// Same proven approach as the Sales Insights province map (D3 + TopoJSON in
// a plain iframe, data pushed in via postMessage) -- replacing the React
// (sa-map.jsx) version, which kept mis-sizing inside its DC-template
// wrapper (hint-size/height propagation issues) no matter how the
// surrounding grid/flex was adjusted. 2026-08-23.
function normName(s) {
  return (s || '').toUpperCase().replace(/[^A-Z]/g, '');
}

let data = {}, features = null;

function draw() {
  if (!features) return;
  const el = document.getElementById('map');
  const w = el.clientWidth || 520, h = el.clientHeight || 420;
  d3.select('#map').selectAll('svg').remove();
  const svg = d3.select('#map').append('svg').attr('viewBox', '0 0 ' + w + ' ' + h);
  const proj = d3.geoMercator().fitSize([w, h], { type: 'FeatureCollection', features });
  const path = d3.geoPath(proj);
  const tip = document.getElementById('tip');

  const defs = svg.append('defs').append('pattern').attr('id', 'hatch').attr('width', 6).attr('height', 6)
    .attr('patternTransform', 'rotate(45)').attr('patternUnits', 'userSpaceOnUse');
  defs.append('rect').attr('width', 6).attr('height', 6).attr('fill', '#0d2137');
  defs.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 6).attr('stroke', '#1c3f6b').attr('stroke-width', 2);

  svg.selectAll('path').data(features).enter().append('path')
    .attr('class', 'prov')
    .attr('d', path)
    .attr('fill', f => {
      const r = data[normName(f.properties.NAME_1)];
      return r ? (r.color || '#1b3557') : 'url(#hatch)';
    })
    .attr('fill-opacity', f => data[normName(f.properties.NAME_1)] ? 0.62 : 1)
    .on('mousemove', (ev, f) => showTip(ev, f))
    .on('mouseleave', () => { tip.style.opacity = 0; });

  function showTip(ev, f) {
    const r = data[normName(f.properties.NAME_1)];
    tip.innerHTML = '<div class="n">' + f.properties.NAME_1 + '</div>' + (r
      ? '<div class="r"><span>Attendance MTD</span><b style="color:' + (r.color || '#8DA2B5') + '">' + r.progressLabel + '</b></div>'
      : '<div class="r"><span>No data recorded</span></div>');
    tip.style.opacity = 1;
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 165) + 'px';
    tip.style.top = Math.max(6, ev.clientY - 20) + 'px';
  }

  svg.selectAll('text').data(features).enter().append('text')
    .attr('class', 'plabel')
    .attr('x', f => path.centroid(f)[0])
    .attr('y', f => path.centroid(f)[1])
    .attr('text-anchor', 'middle')
    .text(f => f.properties.NAME_1);
}

fetch('sa-provinces.topo.json').then(r => r.json()).then(topo => {
  const fc = topojson.feature(topo, topo.objects.ZAF_adm1);
  features = fc.features.filter(f => f.properties.NAME_1.indexOf('isolated') < 0);
  draw();
  parent.postMessage({ type: 'pg-map-ready' }, '*');
});

window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'pg-map-data') return;
  data = {};
  (e.data.rows || []).forEach(r => { data[normName(r.name)] = r; });
  draw();
});
window.addEventListener('resize', draw);
</script>
</body>
</html>
