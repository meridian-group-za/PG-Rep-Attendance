<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — P&amp;G Rep Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Same tokens as the dashboard itself (P&G Rep Attendance Dashboard.dc.html)
       -- keep these two files in sync if the dashboard's palette changes. */
    --color-bg:#000C21; --color-surface:#061530; --color-text:#f3f7fc;
    --color-accent:#ec6d25; --color-accent-300:#f2955c;
    --color-neutral-200:#e2ebf5; --color-neutral-300:#c9d7e6; --color-neutral-400:#9dc4ec;
    --color-neutral-500:#5f80a6; --color-neutral-800:#1c3f6b;
    --radius-md:8px; --radius-lg:14px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Poppins', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  .lg-shell {
    background:
      radial-gradient(120% 70% at 8% -10%, #0e2a4c 0%, var(--color-bg) 55%),
      radial-gradient(circle at 85% 100%, rgba(236,109,37,.08), transparent 40%);
    position:fixed; inset:0; z-index:-1;
  }
  .lg-card {
    width:360px; background:var(--color-surface); border:1px solid var(--color-neutral-800);
    border-radius:var(--radius-lg); padding:32px 28px 26px; box-shadow:0 24px 60px rgba(0,0,0,.4);
  }
  .lg-logo { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:24px; }
  .lg-logo-mark { width:34px; height:34px; border-radius:8px; background:linear-gradient(145deg, var(--color-accent), #a94711); flex:none; }
  .lg-logo-text { font-size:16px; font-weight:700; letter-spacing:-0.015em; }
  .lg-logo-text span { color:var(--color-accent); }
  .lg-title { font-size:18px; font-weight:700; margin:0; }
  .lg-sub { font-size:11px; color:var(--color-neutral-500); margin-top:4px; margin-bottom:22px; }
  .lg-label { font-size:11px; font-weight:500; color:var(--color-neutral-400); letter-spacing:.02em; margin-bottom:6px; display:block; }
  .lg-field { margin-bottom:16px; }
  .lg-input {
    width:100%; height:38px; background:#0a1c3a; border:1px solid var(--color-neutral-800);
    border-radius:var(--radius-md); color:var(--color-text); font-family:inherit; font-size:12.5px;
    padding:0 12px; outline:none; transition:border-color .14s ease;
  }
  .lg-input::placeholder { color:var(--color-neutral-500); }
  .lg-input:focus { border-color:var(--color-accent); }
  .lg-row { display:flex; justify-content:space-between; align-items:center; }
  .lg-forgot { font-size:10.5px; color:var(--color-accent-300); text-decoration:none; margin-bottom:6px; }
  .lg-error {
    font-size:11px; color:#D94F3A; background:rgba(217,79,58,.1); border:1px solid rgba(217,79,58,.3);
    border-radius:var(--radius-md); padding:8px 10px; margin-bottom:14px; display:none;
  }
  .lg-btn {
    width:100%; height:40px; border:none; border-radius:var(--radius-md); cursor:pointer;
    background:var(--color-accent); color:#fff; font-family:inherit; font-size:13px; font-weight:600;
    transition:background .14s ease;
  }
  .lg-btn:hover { background:#d85f1c; }
  .lg-btn:disabled { opacity:.6; cursor:default; }
  .lg-footer {
    text-align:center; font-size:10.5px; color:var(--color-neutral-500); margin-top:18px;
    padding-top:14px; border-top:1px solid var(--color-neutral-800);
  }
  .lg-copyright { text-align:center; font-size:10px; color:var(--color-neutral-500); margin-top:18px; }
</style>
</head>
<body>
<div class="lg-shell"></div>
<div>
  <div class="lg-card">
    <div class="lg-logo">
      <div class="lg-logo-mark"></div>
      <div class="lg-logo-text">Meridian <span>Group</span></div>
    </div>
    <h1 class="lg-title">Sign in to P&amp;G Rep Attendance</h1>
    <div class="lg-sub">Field intelligence for the P&amp;G account team</div>
    <form id="lgForm">
      <div class="lg-field">
        <label class="lg-label" for="lgEmail">Work email</label>
        <input class="lg-input" id="lgEmail" type="email" placeholder="you@meridiangroup.co.za" required>
      </div>
      <div class="lg-field">
        <div class="lg-row">
          <label class="lg-label" for="lgPass">Password</label>
          <a class="lg-forgot" href="#">Forgot?</a>
        </div>
        <input class="lg-input" id="lgPass" type="password" placeholder="••••••••" required>
      </div>
      <div class="lg-error" id="lgError">Enter your email and password.</div>
      <button class="lg-btn" id="lgSubmit" type="submit">Sign in</button>
    </form>
    <div class="lg-footer">Need access? Contact your regional admin.</div>
  </div>
  <div class="lg-copyright">© 2026 Meridian Group. All rights reserved.</div>
</div>
<script>
  // Static prototype gate -- no real auth backend exists for this
  // standalone dashboard yet. Any non-empty email/password proceeds
  // through to the dashboard. Wire this up to real auth (Entra ID,
  // matching the per-client access project) before relying on it to
  // actually restrict access.
  document.getElementById('lgForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('lgEmail').value.trim();
    var pass = document.getElementById('lgPass').value;
    var errEl = document.getElementById('lgError');
    if (!email || !pass) {
      errEl.textContent = 'Enter your email and password.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    var btn = document.getElementById('lgSubmit');
    btn.disabled = true; btn.textContent = 'Signing in…';
    setTimeout(function () {
      window.location.href = './P%26G%20Rep%20Attendance%20Dashboard.dc.html';
    }, 400);
  });
</script>
</body>
</html>
